<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ark Storage</title>
<meta name="theme-color" content="#0f1115">
<meta name="ark-version" content="{{v}}">
<link rel="icon" href="/static/icon-32.png?v={{v}}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{v}}">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/static/style.css?v={{v}}">
</head>
<body>
<main id="login" hidden>
  <div class="login-card">
    <div class="brand"><img src="/static/icon-192.png?v={{v}}" alt="" width="44" height="44"><div><h1>Ark Storage</h1><p>Your own cloud, stored in GitHub</p></div></div>
    <form id="login-form" autocomplete="on">
      <div class="field"><label for="lu">Username</label><input class="inp" id="lu" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="field"><label for="lp">Password</label><input class="inp" id="lp" name="password" type="password" autocomplete="current-password" required></div>
      <div class="err" id="login-err" role="alert"></div>
      <button class="btn primary" style="width:100%" type="submit">Sign in</button>
    </form>
  </div>
</main>
<div id="app" hidden></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:20px">Ark Storage needs JavaScript.</p></noscript>
<script src="/static/files-core.js?v={{v}}"></script>
<script src="/static/editor-core.js?v={{v}}"></script>
<script src="/static/ui.js?v={{v}}"></script>
<script src="/static/editor.js?v={{v}}"></script>
<script src="/static/settings.js?v={{v}}"></script>
<script src="/static/progress.js?v={{v}}"></script>
<script src="/static/pdfview.js?v={{v}}"></script>
<script src="/static/app.js?v={{v}}"></script>
</body>
</html>
